name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify gofmt leaves no diff
        run: |
          gofmt -w $(find . -type f -name '*.go')
          git diff --exit-code

  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test race-sensitive manager and recovery behavior
        run: go test -race ./...
      - name: Build CLI
        run: go build ./cmd/plugman
      - name: Test Windows user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "plugman-installer-test"
          $packagedInstaller = Join-Path $env:RUNNER_TEMP "install.ps1"
          (Get-Content -LiteralPath ./install.ps1 -Raw).Replace("@PLUGMAN_VERSION@", "v0.1.2") | Set-Content -LiteralPath $packagedInstaller
          & $packagedInstaller -InstallDir $installDir -NoModifyPath
          $installedVersion = & (Join-Path $installDir "plugman.exe") --version
          if ($installedVersion -ne "v0.1.2") {
            throw "Installed version was '$installedVersion', expected 'v0.1.2'."
          }
