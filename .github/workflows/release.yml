name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a semantic version tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build versioned executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extension=""
          if [[ "$GOOS" == "windows" ]]; then
            extension=".exe"
          fi
          artifact="plugman_${VERSION}_${GOOS}_${GOARCH}${extension}"
          mkdir -p dist
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${artifact}" \
            ./cmd/plugman
      - uses: actions/upload-artifact@v4
        with:
          name: plugman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/plugman_*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugman-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          count="$(find dist -maxdepth 1 -type f -name 'plugman_*' | wc -l)"
          test "$count" -eq 6
          cd dist
          LC_ALL=C sha256sum plugman_* > checksums.txt
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Plugman $GITHUB_REF_NAME"
